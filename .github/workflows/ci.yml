name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# Anuluj starsze przebiegi dla tej samej gałęzi (oszczędza minuty CI).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint · test · build
    runs-on: ubuntu-latest
    # Na poziomie zadania, żeby krok analizy mógł sprawdzić w `if`, czy sekret istnieje.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: https://sonarcloud.io
    steps:
      - uses: actions/checkout@v4
        with:
          # Sonar potrzebuje pełnej historii, żeby rozpoznać „nowy kod" i autorów zmian.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22' # ≥ 20.19 wymagane przez Vite 8 (Rolldown)
          cache: npm

      - run: npm ci

      - run: npm run lint

      # Testy z pokryciem — raport lcov czyta potem SonarCloud.
      - run: npm run test:coverage

      - run: npm run build

      - name: Cache SonarQube packages
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # Brak sekretu (np. PR z forka) pomija analizę zamiast wywracać całe CI.
      - name: SonarCloud
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v8
