# Konfiguracja analizy SonarCloud (organizacja wspólna z gamehive-backend).
# Skaner uruchamia GitHub Actions — patrz .github/workflows/ci.yml.

sonar.projectKey=Minner22_gamehive-frontend
sonar.organization=minner22
sonar.projectName=gamehive-frontend

sonar.sources=src
sonar.sourceEncoding=UTF-8

# Testy leżą obok kodu (konwencja repo), więc wskazujemy je wzorcem nazwy.
# Sonar sam wyłącza pliki testowe ze zbioru źródeł.
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx

# Pokrycie z Vitesta (provider v8) — raport generuje `npm run test:coverage`.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Z analizy wypada kod generowany: schema.d.ts powstaje z OpenAPI (npm run gen:api),
# więc uwagi do niego byłyby zgłoszeniami do backendu, nie do tego repo.
sonar.exclusions=src/api/schema.d.ts,dist/**,coverage/**

# Wykluczenia pokrycia w duchu backendu (dto/model/config): pliki bez logiki,
# której dałoby się sensownie dowieść testem. Lista musi zgadzać się z sekcją
# `test.coverage.exclude` w vite.config.ts.
sonar.coverage.exclusions=src/api/schema.contract.ts,src/api/types.ts,src/main.tsx,src/test/**,**/*.d.ts
